[package]
name = "radio-control-protocol"
version = "0.2.0"
edition = "2024"

resolver = "2"

[dependencies]
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
# embedded-hal-nb = "1.0.0"
heapless = "0.9.2"
itoa = "1.0.18"
#nb = "1.1.0"

[dev-dependencies]
