#mock-serial-async = {git ="https://github.com/adoble/mock-serial-async" }
embedded-io-async-mock = { git = "https://github.com/adoble/embedded-io-async-mock", tag = "v0.1.0" }


# Need tokio::test to have async unit tests
tokio = {version = "1.52.2", features = ["macros", "rt"]}
